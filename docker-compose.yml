services:
  postgres:
    image: srjm2024/banco-srjm-postgres:latest
    build:
      context: ./postgres
    container_name: banco-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-banco_programacao}
      POSTGRES_USER: ${POSTGRES_USER:-banco_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha}
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -U
      - ${POSTGRES_USER:-banco_user}
      - -d
      - ${POSTGRES_DB:-banco_programacao}
      interval: 5s
      timeout: 5s
      retries: 15
    volumes:
    - postgres_data_v18:/var/lib/postgresql/data
    networks:
    - banco-data
  backend:
    image: srjm2024/banco-srjm-backend:latest
    build:
      context: ./backend
    container_name: banco-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-banco_programacao}
      DB_USER: ${POSTGRES_USER:-banco_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-noreply@bancosrjm.local}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8088/}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-chave-local-banco-srjm-nao-usar-em-producao}
      ADMINISTRATOR_CREATION_TOKEN: ${ADMINISTRATOR_CREATION_TOKEN:-srjm}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-banco-srjm-api}
      OTEL_TRACES_SAMPLER_PROBABILITY: ${OTEL_TRACES_SAMPLER_PROBABILITY:-1.0}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    expose:
    - '8080'
    networks:
    - banco-edge
    - banco-data
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: banco-mailpit
    ports:
    - ${MAILPIT_PORT:-8025}:8025
    networks:
    - banco-edge
  frontend:
    image: srjm2024/banco-srjm-frontend:latest
    build:
      context: ./frontend
    container_name: banco-frontend
    depends_on:
    - backend
    ports:
    - ${FRONTEND_PORT:-8088}:8080
    networks:
    - banco-edge
volumes:
  postgres_data: null
  postgres_data_v18: null
networks:
  banco-edge:
    driver: bridge
  banco-data:
    driver: bridge
