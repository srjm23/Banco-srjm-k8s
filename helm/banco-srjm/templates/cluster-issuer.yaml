{{ if and .Values.certManager.enabled .Values.certManager.createIssuer }}
{{ if ne .Values.certManager.issuerRef.kind "ClusterIssuer" }}
{{ fail "createIssuer requer issuerRef.kind=ClusterIssuer" }}
{{ end }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.certManager.issuerRef.name | quote }}
spec:
  acme:
    email: {{ required "Informe certManager.email" .Values.certManager.email | quote }}
    server: {{ .Values.certManager.server | quote }}
    privateKeySecretRef:
      name: {{ printf "%s-account-key" .Values.certManager.issuerRef.name | quote }}
    solvers: {{ required "Configure certManager.solvers para o desafio ACME" .Values.certManager.solvers | toJson }}
{{ end }}
