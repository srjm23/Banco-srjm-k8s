apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
{{- if .Values.knative.enabled }}
{{- $host := printf "backend.%s.svc.%s" .Release.Namespace .Values.knative.clusterDomain }}
{{ .Files.Get "files/nginx.conf" | replace "proxy_pass http://backend:8080;" (printf "resolver kube-dns.kube-system.svc.%s valid=10s ipv6=off;\n        resolver_timeout 5s;\n        set $backend_upstream %s;\n        proxy_pass http://$backend_upstream:80;" .Values.knative.clusterDomain $host) | replace "proxy_set_header Host $host;" (printf "proxy_set_header Host %s;\n        proxy_set_header X-Forwarded-Host $host;" $host) | indent 4 }}
{{- else }}
{{ .Files.Get "files/nginx.conf" | indent 4 }}
{{- end }}
  nginx-main.conf: |
{{- if .Values.knative.enabled }}
{{ .Files.Get "files/nginx-main.conf" | replace "/etc/nginx/conf.d/default.conf" "/etc/banco-nginx/nginx.conf" | indent 4 }}
{{- else }}
{{ .Files.Get "files/nginx-main.conf" | indent 4 }}
{{- end }}
