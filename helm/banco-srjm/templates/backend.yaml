{{ if not .Values.knative.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        traffic.sidecar.istio.io/excludeOutboundPorts: '5432'
        sidecar.istio.io/inject: {{ .Values.istio.enabled | quote }}
        checksum/runtime: {{ include "banco-srjm.checksum.runtime" . }}
        checksum/config: {{ include "banco-srjm.checksum.config" . }}
        checksum/secrets: {{ include "banco-srjm.checksum.secrets" . }}
    spec:
      automountServiceAccountToken: false
      volumes:
      - name: application-config
        secret:
          secretName: backend-application
      containers:
      - name: backend
        image: {{ printf "%s:%s" .Values.backend.image.repository .Values.backend.image.tag | quote }}
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
        resources: {{ .Values.backend.resources | toJson }}
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: {{ .Values.secrets.backendName | quote }}
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_DB
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.backendName | quote }}
              key: DB_URL
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.postgresName | quote }}
              key: POSTGRES_PASSWORD
        livenessProbe:
          httpGet:
            path: /api/actuator/health/liveness
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: application-config
          mountPath: /etc/banco
          readOnly: true
        startupProbe:
          httpGet:
            path: /api/actuator/health/liveness
            port: 8080
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /api/actuator/health/readiness
            port: 8080
          periodSeconds: 10
      initContainers:
      - name: wait-for-postgres
        image: {{ printf "%s:%s" .Values.postgres.image.repository .Values.postgres.image.tag | quote }}
        command:
        - sh
        - -c
        - until pg_isready -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep
          2; done
        envFrom:
        - configMapRef:
            name: postgres-config
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
      imagePullSecrets: {{ .Values.imagePullSecrets | toJson }}
{{ end }}
