imagePullSecrets: []
secrets:
  create: false
  postgresName: postgres-secret
  backendName: backend-secret
  postgresPassword: ''
  databaseUrl: ''
  mailUsername: ''
  mailPassword: ''
  dataEncryptionKey: ''
  administratorCreationToken: ''
postgres:
  database: banco_programacao
  username: banco_user
  persistence:
    size: 20Gi
    storageClassName: banco-ebs-gp3
  image:
    repository: srjm2024/banco-srjm-postgres
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 1Gi
storageClass:
  create: true
  provisioner: ebs.csi.aws.com
  reclaimPolicy: Retain
  parameters:
    type: gp3
    encrypted: 'true'
    fsType: ext4
backend:
  frontendUrl: ''
  image:
    repository: srjm2024/banco-srjm-backend
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 1Gi
  replicas: 1
  config:
    SPRING_CONFIG_ADDITIONAL_LOCATION: file:/etc/banco/application.yaml
    SERVER_FORWARD_HEADERS_STRATEGY: framework
    MANAGEMENT_TRACING_ENABLED: 'false'
    MAIL_HOST: mailpit
    MAIL_PORT: '1025'
    MAIL_FROM: noreply@bancosrjm.local
    MAIL_SMTP_AUTH: 'false'
    MAIL_STARTTLS: 'false'
    SPRING_PROFILES_ACTIVE: ''
    OTEL_SERVICE_NAME: banco-srjm-api
    OTEL_TRACES_SAMPLER_PROBABILITY: '1.0'
    OTEL_TRACES_EXPORTER: none
    OTEL_METRICS_EXPORTER: none
    OTEL_LOGS_EXPORTER: none
frontend:
  image:
    repository: srjm2024/banco-srjm-frontend
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  replicas: 1
mailpit:
  enabled: true
  image:
    repository: axllent/mailpit
    tag: v1.27
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  replicas: 1
istio:
  enabled: true
  host: bancosrjm.geradorqrcode-srjm.uk
  gateway:
    create: true
    name: banco-srjm
    namespace: istio
    selector:
      istio: ingress
    tlsCredentialName: banco-srjm-tls
knative:
  enabled: true
  ingressClass: istio.ingress.networking.knative.dev
  createDomainClaim: true
  clusterDomain: cluster.local
  frontend:
    traffic: []
    minScale: 1
    maxScale: 3
    containerConcurrency: 80
  backend:
    traffic: []
    minScale: 1
    maxScale: 3
    containerConcurrency: 20
  timeoutSeconds: 300
  flywayConnectRetries: 60
certManager:
  enabled: true
  secretName: banco-srjm-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
    group: cert-manager.io
  createIssuer: false
  email: ''
  server: https://acme-v02.api.letsencrypt.org/directory
  solvers: []
