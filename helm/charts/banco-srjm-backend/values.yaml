image:
  repository: srjm2024/banco-srjm-backend
  tag: latest
  digest: ''
  pullPolicy: Always
imagePullSecrets: []
resources:
  limits:
    cpu: '1'
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi
knative:
  ingressClass: istio.ingress.networking.knative.dev
  minScale: 1
  maxScale: 3
  containerConcurrency: 20
  timeoutSeconds: 300
  traffic: []
configVersion: ''
config:
  MAIL_HOST: mailpit
  MAIL_PORT: '1025'
  MAIL_FROM: noreply@bancosrjm.local
  MAIL_SMTP_AUTH: 'false'
  MAIL_STARTTLS: 'false'
  FRONTEND_URL: https://bancosrjm.geradorqrcode-srjm.uk/
  SPRING_PROFILES_ACTIVE: ''
  OTEL_SERVICE_NAME: banco-srjm-api
  OTEL_TRACES_SAMPLER_PROBABILITY: '1.0'
  OTEL_TRACES_EXPORTER: none
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  SPRING_CONFIG_ADDITIONAL_LOCATION: file:/etc/banco/application.yaml
  SERVER_FORWARD_HEADERS_STRATEGY: framework
  MANAGEMENT_TRACING_ENABLED: 'false'
database:
  configMapName: postgres-config
secrets:
  backendName: backend-secret
  postgresName: postgres-secret
  applicationName: backend-application
externalSecrets:
  enabled: true
  storeName: vault-banco
  refreshInterval: 1m
  pathPrefix: ''
flywayConnectRetries: 60
mailpit:
  enabled: true
  image:
    repository: axllent/mailpit
    tag: v1.27
    digest: ''
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
