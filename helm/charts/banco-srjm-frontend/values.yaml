image:
  repository: srjm2024/banco-srjm-frontend
  tag: latest
  digest: ''
  pullPolicy: Always
imagePullSecrets: []
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi
knative:
  ingressClass: istio.ingress.networking.knative.dev
  minScale: 1
  maxScale: 3
  containerConcurrency: 80
  timeoutSeconds: 300
  traffic: []
configVersion: ''
backend:
  serviceName: backend
  namespace: ''
clusterDomain: cluster.local
dnsResolver: ''
domain:
  enabled: true
  host: bancosrjm.geradorqrcode-srjm.uk
  createClaim: true
tls:
  secretName: banco-srjm-tls
  createCertificate: true
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-production
