{{- if .Values.domain.enabled }}
apiVersion: serving.knative.dev/v1beta1
kind: DomainMapping
metadata:
  name: {{ .Values.domain.host | quote }}
  namespace: {{ .Release.Namespace }}
  annotations:
    networking.knative.dev/ingress-class: {{ .Values.knative.ingressClass | quote }}
    networking.knative.dev/http-protocol: redirected
spec:
  ref:
    apiVersion: serving.knative.dev/v1
    kind: Service
    name: frontend
  tls:
    secretName: {{ .Values.tls.secretName | quote }}
{{- end }}
