apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://srjm23.github.io/Banco-srjm-k8s/
    targetRevision: 1.0.0
    helm:
      releaseName: frontend
      valuesObject:
        image:
          repository: srjm2024/banco-srjm-frontend
          tag: latest-1.1.0
          digest: ""
    chart: banco-srjm-frontend
  destination:
    server: https://kubernetes.default.svc
    namespace: banco-srjm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - FailOnSharedResource=true
