apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-server
  namespace: vault
spec:
  secretName: vault-server-tls
  duration: 2160h
  renewBefore: 360h
  dnsNames:
  - vault
  - vault.vault
  - vault.vault.svc
  - vault.vault.svc.cluster.local
  - vault-0.vault-internal
  - vault-0.vault-internal.vault.svc
  - localhost
  ipAddresses:
  - 127.0.0.1
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: vault-ca
    kind: Issuer
