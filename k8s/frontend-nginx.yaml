apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
  namespace: banco-srjm
data:
  nginx.conf: |
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        http http;
        https https;
    }

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 1m;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location = /api {
            return 308 /api/;
        }

        location /api/ {
            resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
            resolver_timeout 5s;
            set $backend_upstream backend.banco-srjm.svc.cluster.local;
            proxy_pass http://$backend_upstream:80;
            proxy_http_version 1.1;
            proxy_set_header Host backend.banco-srjm.svc.cluster.local;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }
    }

    server {
        listen 8081;
        server_name _;

        location = /stub_status {
            stub_status;
            access_log off;
        }

        location / {
            return 404;
        }
    }
  nginx-main.conf: |
    worker_processes auto;

    error_log /dev/stderr notice;
    pid /run/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        access_log /dev/stdout;
        sendfile on;
        keepalive_timeout 65;
        include /etc/banco-nginx/nginx.conf;
    }
