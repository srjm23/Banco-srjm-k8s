apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: frontend
  namespace: banco-srjm
  annotations:
    networking.knative.dev/ingress-class: istio.ingress.networking.knative.dev
spec:
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: 'false'
        autoscaling.knative.dev/min-scale: '1'
        autoscaling.knative.dev/max-scale: '3'
        checksum/runtime: 22337dbf1cdab1e1a68ec8a4e13fe40206d524d9c7a01ba8d0183e2405dcf40d
        checksum/config: ee4a1e6a3d8df8b9f8aa1d090e0910d8c53f4c22e5170162281943358e9889f0
        checksum/secrets: 75a11da44c802486bc6f65640aa48a730f0f684c5c07a42ba3cd1735eb3fb070
    spec:
      containers:
      - image: srjm2024/banco-srjm-frontend:latest
        imagePullPolicy: Always
        name: frontend
        ports:
        - containerPort: 8080
          name: http1
        readinessProbe:
          httpGet:
            path: /healthz
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/banco-nginx
          readOnly: true
        command:
        - nginx
        args:
        - -c
        - /etc/banco-nginx/nginx-main.conf
        - -g
        - daemon off;
      volumes:
      - configMap:
          name: frontend-nginx
        name: nginx-config
      imagePullSecrets: []
      containerConcurrency: 80
      timeoutSeconds: 300
