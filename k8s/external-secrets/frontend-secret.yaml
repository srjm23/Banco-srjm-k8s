apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frontend-secret
  namespace: banco-srjm
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-banco
    kind: ClusterSecretStore
  target:
    name: frontend-secret
    creationPolicy: Orphan
    deletionPolicy: Retain
  dataFrom:
  - extract:
      key: banco-srjm/frontend-secret
